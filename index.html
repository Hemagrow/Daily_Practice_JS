<html lang="en">
  <head>

  <body>
    <h2>Add New Product</h2>

    <form id="productForm">
      <input type="text" id="title" placeholder="Product Name" />

      <input type="number" id="price" placeholder="Product Price" />

      <input type="text" id="category" placeholder="Category" />
      <input type="file" id="img" placeholder="choose" accept="image/*" />
      <textarea id="description" placeholder="Description" required></textarea>

      <button type="submit" id="submitBtn">Add Product</button>
    </form>

    <div class="wide-container">
      <div class="container product_container">
        <div class="productcards"></div>
      </div>
    </div>
